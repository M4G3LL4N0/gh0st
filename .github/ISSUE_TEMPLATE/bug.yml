name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: gh0st Version
      description: What version are you running? (e.g., v1.0.0, main branch commit)
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you encounter the bug?
      options:
        - CLI (Terminal)
        - Browser (Local dev server)
        - Browser (Production build)
        - macOS Native App
        - iOS Simulator
        - iOS Device
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS and version (e.g., macOS 14.5, Ubuntu 22.04)
      placeholder: "macOS 14.5 (Apple Silicon)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run `gh0st chat` and send a message..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Run `gh0st chat`
        2. Type "hello"
        3. Press Enter
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The message should be sent to xAI and a response should stream back"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, logs, screenshots.
      placeholder: "Error: Connection refused at WebSocket..."

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant logs (CLI debug, browser console, macOS Console.app)
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      description: Confirm your report doesn't contain sensitive data
      options:
        - label: I have removed API keys, personal conversations, and file paths from this report
          required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss, security, crash on start)
        - High (major feature broken)
        - Medium (minor feature broken, workaround exists)
        - Low (cosmetic, enhancement)
    validations:
      required: true