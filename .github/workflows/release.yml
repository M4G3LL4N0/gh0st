name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        run: pnpm build
      - name: Generate changelog
        run: |
          git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"- %s (%h)" --reverse > CHANGELOG_GENERATED.md || echo "No previous tag" > CHANGELOG_GENERATED.md
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/client/dist/**/*
            apps/cli/dist/**/*
            apps/site/dist/**/*
          generate_release_notes: true
          body_path: CHANGELOG_GENERATED.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS app
        run: |
          cd apps/client
          pnpm tauri build --target aarch64-apple-darwin
        env:
          TAURI_PRIVATE_API: "true"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh0st-macos
          path: apps/client/src-tauri/target/release/bundle/macos/*.app
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build iOS project
        run: |
          cd apps/client
          cargo build --manifest-path src-tauri/gen/ios/Cargo.toml --target aarch64-apple-ios --release
        env:
          TAURI_PRIVATE_API: "true"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh0st-ios
          path: apps/client/src-tauri/gen/ios/target/aarch64-apple-ios/release/gh0st-ios
          retention-days: 30