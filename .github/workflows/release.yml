name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm build

  macos:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/client/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: gh0st ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            First public release candidate for gh0st.

            Available:
            - macOS Apple Silicon DMG and app archive
            - Local CLI workflow
            - Local browser UI
            - Encrypted local conversations, files, agents, and preferences
            - xAI Responses API integration with `store=false`
            - ZDR-aware runtime verification when enabled for the user's xAI team
            - Web, X, Code, and optional MCP tools

            Privacy:
            - Local-first application state
            - No gh0st cloud required
            - No analytics
            - No telemetry by default
            - xAI processes inference content sent for inference
            - External MCP services have their own privacy boundaries

            Known limitations:
            - This macOS build is ad-hoc signed, not Developer ID signed or notarized
            - macOS may require approval in Privacy & Security on first launch
            - iOS remains in development
            - Live ZDR availability depends on xAI team configuration
            - Auto-update is not enabled until signed updater artifacts are configured

            Verify the DMG with the attached `SHA256SUMS.txt` before installation.
          releaseDraft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          args: --target aarch64-apple-darwin --bundles app,dmg
          releaseAssetNamePattern: gh0st_[version]_[arch].[ext]
          uploadWorkflowArtifacts: true

  checksums:
    name: Generate and publish checksums
    runs-on: ubuntu-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir release-assets --pattern 'gh0st_*'
      - name: Generate SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          (cd release-assets && sha256sum gh0st_*.dmg > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
