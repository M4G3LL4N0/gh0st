name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  RUST_VERSION: "1.75"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Generate cache key
        id: cache-key
        run: echo "key=pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json') }}" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      # No --offline. It was hard-failing with ERR_PNPM_NO_OFFLINE_TARBALL
      # whenever a tarball was absent from the restored store, which took down
      # all nine dependent jobs at once instead of one. --frozen-lockfile still
      # guarantees the resolution is identical; letting pnpm fetch a missing
      # tarball costs cache speed on a cold run and correctness on every other.
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace outputs
        run: pnpm build
      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  security-test:
    name: Security tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Run security tests
        run: pnpm test:security

  build-web:
    name: Build web client
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web client
        run: pnpm build:client
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gh0st-web
          path: apps/client/dist/
          retention-days: 7

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build:cli
      - name: Upload CLI build
        uses: actions/upload-artifact@v4
        with:
          name: gh0st-cli
          path: apps/cli/dist/
          retention-days: 7

  build-site:
    name: Build site
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build:site
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: gh0st-site
          path: apps/site/dist/
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/client/src-tauri/Cargo.lock') }}
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      # `working-directory` is set explicitly rather than relying on
      # `pnpm --filter` to run the command inside apps/client. In CI this step
      # failed with cargo reporting no Cargo.toml at the repository root, which
      # is what happens when the command runs one level too high. I could not
      # reproduce the difference locally -- same pnpm 9.0.0 pin, same tree, and
      # both `exec` and the bare form resolve correctly on this machine -- so
      # this removes the ambiguity rather than claiming a proven root cause.
      - name: Build macOS with Tauri
        working-directory: apps/client
        run: pnpm exec tauri build --target aarch64-apple-darwin --bundles app

  doctor:
    name: gh0st doctor
    runs-on: ubuntu-latest
    needs: [install, build-cli]
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Run doctor
        run: node apps/cli/dist/cli.js doctor
        continue-on-error: true

  # Dependency review for PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high